<!DOCTYPE html>
<html>

<head>

    <title>Maintenance Dashboard</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="navbar">

        <a href="/">Machines</a>

        <a href="/maintenance">Maintenance</a>

        <a href="/dashboard">Dashboard</a>

    </div>

    <div class="container">

        <h1>Maintenance Analytics Dashboard</h1>

        <div class="card">

            <h2>Total Machines</h2>

            <h3>{{ total_machines }}</h3>

        </div>

        <div class="card">

            <h2>Total Maintenance Logs</h2>

            <h3>{{ total_logs }}</h3>

        </div>

        <div class="card">

            <h2>Total Downtime</h2>

            <h3>{{ total_downtime }} minutes</h3>

        </div>

        <div class="card">

            <h2>Most Problematic Machine</h2>

            <h3>{{ problematic_machine[0] }}</h3>

            <p>
                Total Downtime:
                {{ problematic_machine[1] }} minutes
            </p>

        </div>

    </div>

</body>

</html>
